[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "A modular scientific computing toolkit built with plain Python and NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["numcompute*"]
